name: Diagnose Pognali Android

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org ru.pognali \
            --project-name pognali_mvp \
            mobile

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Check project
        working-directory: mobile
        run: flutter analyze

      - name: Build APK with full log
        working-directory: mobile
        run: flutter build apk --debug -v
